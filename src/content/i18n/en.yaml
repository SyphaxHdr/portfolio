commentMaintenu: How is this site maintained?
maintenuIntro: "This site is run like a small team project, even though I work on it alone. Every change follows the same path:"
etapesPipeline:
  - nom: Pull request
    texte: "One short branch per change, then a pull request: nothing is pushed straight to main."
  - nom: Checks
    texte: GitHub Actions builds the site and checks the content, the links, the image sizes and the spelling. If something breaks, the merge is blocked.
  - nom: Merge
    texte: "Squash and merge: one clean commit per change."
  - nom: Deploy
    texte: The site is rebuilt and published on GitHub Pages. The update date comes from the last commit.
