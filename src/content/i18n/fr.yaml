maintenuIntro: "Ce site est géré comme un petit projet d'équipe, même si je suis seul dessus. Chaque changement suit le même chemin :"
etapesPipeline:
  - nom: Pull request
    texte: "Une branche courte par changement, puis une pull request : rien n'est poussé directement sur main."
  - nom: Vérification
    texte: GitHub Actions construit le site et vérifie le contenu, les liens, le poids des images et l'orthographe. Si quelque chose casse, la fusion est bloquée.
  - nom: Fusion
    texte: "Squash and merge : un commit propre par changement."
  - nom: Publication
    texte: Le site est reconstruit et mis en ligne sur GitHub Pages. La date de mise à jour vient du dernier commit.
