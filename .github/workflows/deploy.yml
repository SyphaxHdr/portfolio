# Publication : à chaque fusion sur main, le site est construit puis mis en ligne
# sur GitHub Pages (https://syphaxhdr.github.io).
name: Publication

on:
  push:
    branches: [main]
  workflow_dispatch: # bouton « Run workflow » pour relancer à la main

# Par défaut, lecture seule. Seul le job deploy reçoit le droit de publier.
permissions:
  contents: read

# Une seule publication à la fois ; celle en cours n'est jamais coupée.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        run: npm run build

      # Le dossier dist/ (le site construit) est envoyé au job suivant.
      - name: Envoyer le site construit
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: deploy
    needs: build # attend que le build ait réussi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publier sur GitHub Pages
      id-token: write # prouver à Pages que c'est bien ce workflow qui publie
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
